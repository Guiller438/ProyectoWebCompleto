version: 2.1

jobs:
  build-app:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:latest
    steps:
      - checkout
      - run:
          name: Restaurar dependencias App
          command: dotnet restore ProyectoWebCompleto.sln
      - run:
          name: Compilar App
          command: dotnet build App/App.csproj --configuration Release

  build-tests:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:latest
    steps:
      - checkout
      - run:
          name: Restaurar dependencias de Tests
          command: dotnet restore ProyectoWebCompleto.sln
      - run:
          name: Compilar proyecto de pruebas
          command: dotnet build App.Tests/App.Tests.csproj --configuration Release

  analyze-code:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:latest
    steps:
      - checkout
      - run:
          name: Analizar estilo de código
          command: dotnet format ProyectoWebCompleto.sln --check

workflows:
  parallel-workflow:
    jobs:
      - build-app
      - build-tests
      - analyze-code
